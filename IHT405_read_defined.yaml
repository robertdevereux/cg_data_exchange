    type: basic
    question_refs: [Q1, Q2, Q3]
    gateway_ref: null
    notes: "Header section collecting identifying details for the form. Always shown."

  - ref: S2
    title: "Valuation contact details"
    type: basic
    question_refs: [Q4, Q5, Q6, Q7, Q8, Q9]
    gateway_ref: Q4
    notes: "Q4 is the NAV gateway. If the answer is No, the rest of the section is skipped."

  - ref: S3
    title: "Deceased's residence"
    type: table
    question_refs: [Q10, Q11, Q12, Q13, Q14, Q15, Q16, Q17]
    gateway_ref: null
    notes: "All questions are TABLE COL questions with unconditional routing. Rows correspond to individual properties that formed the deceased's residence."

  - ref: S4
    title: "Other land and buildings"
    type: table
    question_refs: [Q18, Q19, Q20, Q21, Q22, Q23, Q24, Q25]
    gateway_ref: null
    notes: "All questions are TABLE COL questions with unconditional routing. Rows correspond to other land, buildings and rights over land."

  - ref: S5
    title: "Special factors affecting value"
    type: basic
    question_refs: [Q26, Q27, Q28, Q29, Q30, Q31]
    gateway_ref: Q26
    notes: "Q26 gates the section — if No, routing skips to Q32 (S6). Q29 is a further branch within the section."

  - ref: S6
    title: "Property sale details"
    type: conditional_table
    question_refs: [Q32, Q33, Q34, Q35, Q36, Q37, Q38]
    gateway_ref: Q32
    notes: "Q32 gates the sale detail rows. If No, the form ends. The table columns (Q33–Q38) include conditional radio fields within each row, so type is conditional_table."

