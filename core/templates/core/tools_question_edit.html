{% extends "core/base.html" %}

{% block title %}Edit question {{ question.question_id }} — PSS Demo{% endblock %}

{% block content %}

  <a href="{{ back_url }}" class="govuk-back-link">Back</a>

  <div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds">

      <span class="govuk-caption-l">Question <code>{{ question.question_id }}</code></span>
      <h1 class="govuk-heading-l">Edit question</h1>

      <form method="post" action="">
        {% csrf_token %}

        {# Back-navigation params preserved through POST #}
        <input type="hidden" name="back"          value="{{ back }}">
        <input type="hidden" name="back_regime"   value="{{ back_regime }}">
        <input type="hidden" name="back_schedule" value="{{ back_schedule }}">
        <input type="hidden" name="back_section"  value="{{ back_section }}">

        <div class="govuk-form-group">
          <label class="govuk-label govuk-label--s" for="question_text">
            Question text
          </label>
          <textarea class="govuk-textarea" id="question_text" name="question_text"
                    rows="3">{{ question.question_text }}</textarea>
        </div>

        <div class="govuk-form-group">
          <label class="govuk-label govuk-label--s" for="question_type">
            Question type
          </label>
          <select class="govuk-select" id="question_type" name="question_type">
            {% for value, label in question_type_choices %}
            <option value="{{ value }}"
                    {% if value == question.question_type %}selected{% endif %}>
              {{ label }}
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="govuk-form-group">
          <label class="govuk-label govuk-label--s" for="hint">
            Hint
            <span class="govuk-hint">Optional. Appears below the question label.</span>
          </label>
          <input class="govuk-input" id="hint" name="hint" type="text"
                 value="{{ question.hint|default:'' }}">
        </div>

        <div class="govuk-form-group">
          <label class="govuk-label govuk-label--s" for="guidance">
            Guidance
            <span class="govuk-hint">Optional. Appears as inset text above the question.</span>
          </label>
          <textarea class="govuk-textarea" id="guidance" name="guidance"
                    rows="3">{{ question.guidance|default:'' }}</textarea>
        </div>

        <div class="govuk-form-group">
          <label class="govuk-label govuk-label--s" for="options">
            Options
            <span class="govuk-hint">Optional. Semicolon-delimited list for radio/checkbox questions.</span>
          </label>
          <input class="govuk-input" id="options" name="options" type="text"
                 value="{{ question.options|default:'' }}">
        </div>

        <button class="govuk-button" data-module="govuk-button">Save changes</button>
        <a href="{{ back_url }}" class="govuk-button govuk-button--secondary"
           style="margin-left:1rem;">Cancel</a>

      </form>

    </div>
  </div>

{% endblock %}
