{% extends "core/base.html" %}

{% block title %}Section complete — {{ section.section_name }}{% endblock %}

{% block content %}

  <div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds">

      <div class="govuk-panel govuk-panel--confirmation">
        <h1 class="govuk-panel__title">Section complete</h1>
        <div class="govuk-panel__body">
          {{ section.section_name }}
        </div>
      </div>

      <p class="govuk-body" style="margin-top:2em">
        Your answers have been saved.
      </p>

      <a href="{{ task_list_url }}" class="govuk-button govuk-button--secondary"
         data-module="govuk-button">
        Back to task list
      </a>

    </div>
  </div>

{% endblock %}
