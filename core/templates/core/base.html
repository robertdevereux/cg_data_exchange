<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PSS Demo{% endblock %}</title>
</head>
<body>

  <header>
    <p>
      <strong>PSS Demo</strong>
      {% if user.is_authenticated %}
        &nbsp;|&nbsp;
        Signed in as <strong>{{ user.username }}</strong>
        &nbsp;|&nbsp;
        <form method="post" action="{% url 'logout' %}" style="display:inline">
          {% csrf_token %}
          <button type="submit" style="background:none;border:none;padding:0;cursor:pointer;color:inherit;text-decoration:underline;">Sign out</button>
        </form>
      {% else %}
        &nbsp;|&nbsp;
        <a href="{% url 'login' %}">Sign in</a>
      {% endif %}
    </p>
    <hr>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

</body>
</html>
