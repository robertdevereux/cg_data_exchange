  - ref: Q17
    box: 6E
    question_id: HMRC_13
    question_text: "Details of lettings/leases"
    type: textarea
    options: []
    guidance: "If the property was let out by the deceased, provide a copy of the lease, sublease, business or agricultural tenancy agreement. If the following information is not in the agreement, or there is no written agreement, enter it here: date the tenancy or lease began; date the tenancy is due to end; what rent is payable and whether it can be reviewed; who is responsible for the outgoings on the property; name of the tenant. If the property was unoccupied at the date of death, write 'vacant'."
    hint: ""
    required: false
    currency: false
    validation: ""
    notes: "TABLE COL — deceased's residence table."

  - ref: Q18
    box: 6F
    question_id: HMRC_14
    question_text: "Value of Agricultural or Business Relief at 100% or Woodlands Relief or heritage exemption deducted"
    type: number
    options: []
    guidance: "If you are deducting Agricultural Relief, Woodlands Relief, Business Relief or claiming heritage exemption, enter the value of the property that qualifies for relief or exemption. You cannot deduct Business Relief on businesses that deal in properties or investments. For deaths on and after 6 April 2026, relief at 100% on the combined value of qualifying agricultural and/or business property is limited to £2.5 million."
    hint: ""
    required: false
    currency: true
    validation: "Must be zero or a positive number"
    notes: "TABLE COL — deceased's residence table."

  - ref: Q19
    box: 6G
    question_id: HMRC_15
    question_text: "Value of Agricultural or Business Relief at 50%"
    type: number
    options: []
    guidance: "Where the total value of qualifying property exceeds £2.5 million, the excess qualifies for relief at 50%. Unused £2.5 million allowance from a late spouse or civil partner may be transferred to the deceased's estate, provided a claim is made within 4 years of the survivor's death or within 6 months of the personal representatives starting their role."
    hint: ""
    required: false
    currency: true
    validation: "Must be zero or a positive number"
    notes: "TABLE COL — deceased's residence table."

